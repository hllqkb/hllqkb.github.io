# Sample workflow for building and deploying a Jekyll site to GitHub Pages
name: Deploy Jekyll with GitHub Pages dependencies preinstalled

on:
  # master 上推送就构建并发布；PR 只构建检查，不发布
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  # PR 的检查构建各自排队，不和正式发布抢同一个队列
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Check JavaScript syntax
        run: |
          node --check assets/reading.js
          node --check assets/archive.js
          node --check _academy/static/academy.js
          node --check _academy/static/pages-library.js
      - name: Export learning pages and validate internal links
        run: |
          python3 _academy/export_academy.py --output _academy-output
          cp -R _academy-output/learn _academy-output/academy-assets ./
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify versioned reading assets
        run: |
          grep -Eq '/assets/essays[.]css[?]v=[0-9]+' _site/reading/shotsync-online/index.html
          grep -Eq '/assets/reading[.]js[?]v=[0-9]+' _site/reading/shotsync-online/index.html
          grep -Eq '/assets/archive[.]css[?]v=[0-9]+' _site/reading/index.html
          grep -Eq '/assets/archive[.]js[?]v=[0-9]+' _site/reading/index.html
      - name: Verify feeds, sitemap, robots and llms.txt
        run: |
          set -x
          test -s _site/feed.xml
          test -s _site/sitemap.xml
          grep -q 'Sitemap: https://hllqkb.github.io/sitemap.xml' _site/robots.txt
          grep -q '^# ' _site/llms.txt
          if grep -Eq 'https?://[^/]+//' _site/rss.xml; then echo 'rss.xml has double slashes'; exit 1; fi
          grep -q 'application/atom+xml' _site/index.html
          grep -q 'application/atom+xml' _site/reading/index.html
          grep -q 'project-card' _site/projects/index.html
          grep -q 'latest-card' _site/index.html
      - name: Check site size
        # GitHub Pages 站点上限 1GB
        run: |
          size_mb=$(du -sm _site | cut -f1)
          echo "_site is ${size_mb} MB"
          if [ "$size_mb" -gt 950 ]; then echo "::error::_site ${size_mb} MB，接近 1GB 上限"; exit 1; fi
          if [ "$size_mb" -gt 800 ]; then echo "::warning::_site ${size_mb} MB，超过 800MB，考虑压缩或清理图片"; fi
      - name: Dry-run image URL rewrite
        run: |
          check="$RUNNER_TEMP/site-check"
          cp -R _site "$check"
          python3 .github/scripts/rewrite_image_urls.py "$check" https://img.example.test https://hllqkb.github.io
          if grep -rEl --include='*.html' '(^|[^A-Za-z0-9_.:/])/assets/img/posts/' "$check"; then
            echo "::error::rewrite left local image paths"; exit 1
          fi
      # 仓库变量 IMAGE_CDN_BASE（如 https://img.hllqk.cn）为空时跳过，图片仍由 Pages 提供
      - name: Publish post images to R2
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.IMAGE_CDN_BASE != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          # AWS CLI 2.23+ 默认附带的校验和 R2 不支持
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          aws --version
          aws s3 sync assets/img/posts "s3://${R2_BUCKET}/posts" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --size-only --exclude ".gitkeep" \
            --cache-control "public, max-age=31536000, immutable"
      - name: Point post images at R2
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request' && vars.IMAGE_CDN_BASE != ''
        run: python3 .github/scripts/rewrite_image_urls.py _site "${{ vars.IMAGE_CDN_BASE }}" https://hllqkb.github.io
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
